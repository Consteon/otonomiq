# Total 6GB: 3GB for the Gradle engine, 3GB for the Kotlin compiler
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -Dkotlin.daemon.jvm.options=-Xmx3G -Dfile.encoding=UTF-8org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dkotlin.daemon.jvm.options=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds to speed up compilation of multiple plugins
org.gradle.parallel=true

# Enable the build cache to avoid recompiling unchanged code
org.gradle.caching=true

# Keep these standard Android flags
android.useAndroidX=true
android.enableJetifier=true

# Modern Android optimization (speeds up build and reduces R class size)
android.nonTransitiveRClass=true