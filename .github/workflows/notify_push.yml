name: Telegram Push Notification (Cloud)

on:
  push:
    branches:
      - main
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Push Notification
        run: |
          TOKEN="8962305717:AAGJe-vdPWQ-_UQ9cS1kQtBVbplDF2nSg74"
          CHAT_ID="6789524769"
          
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          ENCODED_MSG=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$COMMIT_MSG")
          
          TEXT="👨‍💻 *Code Pushed to GitHub!*%0A%0A📦 *Repository*: \`${REPO}\`%0A🌿 *Branch*: \`${BRANCH}\`%0A👤 *Developer*: \`${ACTOR}\`%0A📝 *Commit Message*:%0A${ENCODED_MSG}"
          
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=${TEXT}" || true
