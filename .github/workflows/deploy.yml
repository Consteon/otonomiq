name: Authenium CI/CD - Build & Upload to TestFlight

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Master Repository
        uses: actions/checkout@v4

      - name: Build and Upload Active Brands
        run: |
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          aum all
